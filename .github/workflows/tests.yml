name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The pure logic under test (landmarks, gesture_classifier,
      # gesture_stabilizer, action_dispatcher) only needs numpy + pytest.
      # OpenCV and MediaPipe are not imported by the test suite.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q
