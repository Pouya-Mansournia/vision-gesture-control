[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-gesture-control"
version = "0.1.0"
description = "Real-time webcam hand-gesture recognition mapped to laptop actions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pouya Mansournia" }]
keywords = [
    "computer-vision", "gesture-recognition", "hand-tracking",
    "mediapipe", "opencv", "real-time", "webcam",
]
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
vision-gesture-control = "vision_gesture_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
